<body class="bg-[#09050d] m-0 p-0 overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ============================================================================
    // 1. AUDIO ENGINE (DIRECT CHROME MP3 PLAYBACK + BAROQUE FALLBACK + VISUALIZER)
    // ============================================================================
    class RomanticAudioEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.analyser = null;
        this.dataArray = null;
        this.isPlaying = false;
        this.volume = 0.72;
        this.isMuted = false;
        this.mode = 'file';
        this.audioEl = null;
        this.hasCustomFile = false;

        this.duration = 207;
        this.elapsed = 0;
        this.stepIndex = 0;
        this.schedulerTimer = null;
        this.clockTimer = null;
        this.nextNoteTime = 0;

        this.measures = [
          {
            bass: 92.50,
            notes: [185.00, 220.00, 277.18, 220.00, 329.63, 277.18, 369.99, 329.63, 277.18, 415.30, 369.99, 329.63, 277.18],
            pad: [185.00, 220.00, 277.18, 329.63]
          },
          {
            bass: 123.47,
            notes: [246.94, 293.66, 369.99, 293.66, 440.00, 369.99, 493.88, 440.00, 369.99, 440.00, 369.99, 329.63, 293.66],
            pad: [246.94, 293.66, 369.99, 440.00]
          },
          {
            bass: 82.41,
            notes: [164.81, 207.65, 246.94, 207.65, 329.63, 246.94, 369.99, 329.63, 246.94, 415.30, 369.99, 329.63, 246.94],
            pad: [164.81, 207.65, 246.94, 369.99]
          },
          {
            bass: 110.00,
            notes: [220.00, 277.18, 329.63, 277.18, 415.30, 329.63, 440.00, 415.30, 329.63, 493.88, 440.00, 329.63, 277.18],
            pad: [220.00, 277.18, 329.63, 415.30]
          },
          {
            bass: 73.42,
            notes: [146.83, 220.00, 277.18, 220.00, 329.63, 277.18, 369.99, 329.63, 277.18, 329.63, 277.18, 220.00, 185.00],
            pad: [146.83, 220.00, 277.18, 369.99]
          },
          {
            bass: 69.30,
            notes: [138.59, 207.65, 277.18, 207.65, 311.13, 277.18, 369.99, 311.13, 277.18, 311.13, 277.18, 246.94, 207.65],
            pad: [138.59, 207.65, 246.94, 311.13]
          }
        ];
        this.measureIdx = 0;
      }

      initContext() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContextClass();
          this.masterGain = this.ctx.createGain();
          const safeVol = Number.isFinite(this.volume) ? this.volume : 0.72;
          this.masterGain.gain.value = this.isMuted ? 0 : safeVol;

          this.analyser = this.ctx.createAnalyser();
          this.analyser.fftSize = 64;
          this.analyser.smoothingTimeConstant = 0.82;
          this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);

          this.masterGain.connect(this.analyser);
          this.analyser.connect(this.ctx.destination);
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playHarpsichordNote(freq, time, duration, velocity = 0.16) {
        if (!this.ctx || !this.masterGain) return;
        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const noteGain = this.ctx.createGain();

        osc1.type = 'triangle';
        osc1.frequency.setValueAtTime(freq, time);

        osc2.type = 'sawtooth';
        osc2.frequency.setValueAtTime(freq * 2.001, time);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(3200, time);
        filter.frequency.exponentialRampToValueAtTime(650, time + duration);

        noteGain.gain.setValueAtTime(0.0001, time);
        noteGain.gain.linearRampToValueAtTime(velocity, time + 0.012);
        noteGain.gain.exponentialRampToValueAtTime(0.0008, time + duration);

        const osc2Gain = this.ctx.createGain();
        osc2Gain.gain.value = 0.28;

        osc1.connect(filter);
        osc2.connect(osc2Gain);
        osc2Gain.connect(filter);
        filter.connect(noteGain);
        noteGain.connect(this.masterGain);

        osc1.start(time);
        osc2.start(time);
        osc1.stop(time + duration + 0.05);
        osc2.stop(time + duration + 0.05);
      }

      playVelvetPad(freqs, bassFreq, time, duration) {
        if (!this.ctx || !this.masterGain) return;
        const bassOsc = this.ctx.createOscillator();
        const bassGain = this.ctx.createGain();
        bassOsc.type = 'sine';
        bassOsc.frequency.setValueAtTime(bassFreq, time);
        bassGain.gain.setValueAtTime(0.0001, time);
        bassGain.gain.linearRampToValueAtTime(0.18, time + 0.18);
        bassGain.gain.exponentialRampToValueAtTime(0.001, time + duration);
        bassOsc.connect(bassGain);
        bassGain.connect(this.masterGain);
        bassOsc.start(time);
        bassOsc.stop(time + duration + 0.1);

        freqs.forEach((f) => {
          const osc = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          const padGain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, time);
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(900, time);
          padGain.gain.setValueAtTime(0.0001, time);
          padGain.gain.linearRampToValueAtTime(0.055, time + 0.35);
          padGain.gain.exponentialRampToValueAtTime(0.0008, time + duration);
          osc.connect(filter);
          filter.connect(padGain);
          padGain.connect(this.masterGain);
          osc.start(time);
          osc.stop(time + duration + 0.1);
        });
      }

      scheduleSynth() {
        if (!this.isPlaying || this.mode !== 'synth' || !this.ctx) return;
        const eighthDur = 0.245;
        while (this.nextNoteTime < this.ctx.currentTime + 0.18) {
          const measure = this.measures[this.measureIdx];
          if (this.stepIndex === 0) {
            this.playVelvetPad(measure.pad, measure.bass, this.nextNoteTime, eighthDur * 13);
          }
          const noteFreq = measure.notes[this.stepIndex];
          const accent = [0, 3, 6, 9].includes(this.stepIndex) ? 0.17 : 0.11;
          this.playHarpsichordNote(noteFreq, this.nextNoteTime, eighthDur * 1.45, accent);
          this.nextNoteTime += eighthDur;
          this.stepIndex++;
          if (this.stepIndex >= 13) {
            this.stepIndex = 0;
            this.measureIdx = (this.measureIdx + 1) % this.measures.length;
          }
        }
      }

      playHeartbeatChime() {
        this.initContext();
        if (!this.ctx || !this.masterGain) return;
        const now = this.ctx.currentTime;
        const thump = (offset, freq, gainPeak) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + offset);
          osc.frequency.exponentialRampToValueAtTime(42, now + offset + 0.16);
          g.gain.setValueAtTime(0.0001, now + offset);
          g.gain.linearRampToValueAtTime(gainPeak, now + offset + 0.015);
          g.gain.exponentialRampToValueAtTime(0.0008, now + offset + 0.22);
          osc.connect(g);
          g.connect(this.masterGain);
          osc.start(now + offset);
          osc.stop(now + offset + 0.25);
        };
        thump(0, 115, 0.36);
        thump(0.18, 95, 0.28);

        const chime = this.ctx.createOscillator();
        const cg = this.ctx.createGain();
        chime.type = 'triangle';
        chime.frequency.setValueAtTime(880, now + 0.02);
        chime.frequency.exponentialRampToValueAtTime(1318.5, now + 0.28);
        cg.gain.setValueAtTime(0.0001, now + 0.02);
        cg.gain.linearRampToValueAtTime(0.09, now + 0.05);
        cg.gain.exponentialRampToValueAtTime(0.0005, now + 0.55);
        chime.connect(cg);
        cg.connect(this.masterGain);
        chime.start(now + 0.02);
        chime.stop(now + 0.6);
      }

      initLocalAudio(defaultSrc = './Golden_Brown.mp3') {
        if (this.audioEl || typeof window === 'undefined') return;
        const candidates = [
          defaultSrc,
          './Golden Brown.mp3',
          './golden_brown.mp3',
          './golden-brown.mp3',
          './Golden_Brown (1).mp3'
        ];
        let idx = 0;

        this.audioEl = new Audio();
        this.audioEl.src = candidates[idx];
        this.audioEl.loop = true;
        this.audioEl.preload = 'auto';
        this.audioEl.volume = this.isMuted ? 0 : this.volume;

        this.audioEl.onloadedmetadata = () => {
          if (isFinite(this.audioEl.duration) && this.audioEl.duration > 0) {
            this.duration = this.audioEl.duration;
          }
          this.mode = 'file';
        };

        this.audioEl.onerror = () => {
          if (this.hasCustomFile) return;
          idx++;
          if (idx < candidates.length) {
            this.audioEl.src = candidates[idx];
            this.audioEl.load();
          } else {
            this.mode = 'synth';
          }
        };
      }

      start() {
        this.initContext();
        if (this.isPlaying) return;
        this.isPlaying = true;

        this.initLocalAudio('./Golden_Brown.mp3');

        if (this.mode === 'file' && this.audioEl) {
          this.audioEl.volume = this.isMuted ? 0 : this.volume;
          const p = this.audioEl.play();
          if (p && typeof p.catch === 'function') {
            p.catch(() => {
              this.mode = 'synth';
              this.nextNoteTime = this.ctx.currentTime + 0.05;
              this.schedulerTimer = setInterval(() => this.scheduleSynth(), 50);
            });
          }
        } else {
          this.nextNoteTime = this.ctx.currentTime + 0.05;
          this.schedulerTimer = setInterval(() => this.scheduleSynth(), 50);
        }

        if (this.clockTimer) clearInterval(this.clockTimer);
        this.clockTimer = setInterval(() => {
          if (!this.isPlaying) return;
          if (this.mode === 'file' && this.audioEl) {
            this.elapsed = this.audioEl.currentTime || 0;
            if (isFinite(this.audioEl.duration) && this.audioEl.duration > 0) {
              this.duration = this.audioEl.duration;
            }
          } else {
            this.elapsed += 0.25;
            if (this.elapsed >= this.duration) {
              this.elapsed = 0;
            }
          }
        }, 250);
      }

      pause() {
        this.isPlaying = false;
        if (this.schedulerTimer) clearInterval(this.schedulerTimer);
        if (this.clockTimer) clearInterval(this.clockTimer);
        if (this.mode === 'file' && this.audioEl) {
          this.audioEl.pause();
        }
      }

      toggle() {
        if (this.isPlaying) {
          this.pause();
        } else {
          this.start();
        }
        return this.isPlaying;
      }

      setVolume(val) {
        this.volume = Math.max(0, Math.min(1, val));
        if (this.audioEl) {
          this.audioEl.volume = this.isMuted ? 0 : this.volume;
        }
        if (this.masterGain && this.ctx) {
          this.masterGain.gain.setTargetAtTime(this.isMuted ? 0 : this.volume, this.ctx.currentTime, 0.04);
        }
      }

      toggleMute() {
        this.isMuted = !this.isMuted;
        if (this.audioEl) {
          this.audioEl.volume = this.isMuted ? 0 : this.volume;
        }
        if (this.masterGain && this.ctx) {
          this.masterGain.gain.setTargetAtTime(this.isMuted ? 0 : this.volume, this.ctx.currentTime, 0.04);
        }
        return this.isMuted;
      }

      loadCustomFile(file, onLoaded) {
        if (this.schedulerTimer) clearInterval(this.schedulerTimer);

        const url = URL.createObjectURL(file);
        if (!this.audioEl) {
          this.audioEl = new Audio();
          this.audioEl.loop = true;
          this.audioEl.preload = 'auto';
        }

        this.hasCustomFile = true;
        this.audioEl.pause();
        this.audioEl.src = url;
        this.audioEl.load();
        this.audioEl.volume = this.isMuted ? 0 : this.volume;
        this.mode = 'file';
        this.elapsed = 0;

        this.audioEl.onloadedmetadata = () => {
          if (isFinite(this.audioEl.duration) && this.audioEl.duration > 0) {
            this.duration = this.audioEl.duration;
          }
          if (onLoaded) onLoaded(file.name, this.duration);
        };

        this.isPlaying = true;
        const playPromise = this.audioEl.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(() => {
            this.isPlaying = false;
          });
        }

        if (this.clockTimer) clearInterval(this.clockTimer);
        this.clockTimer = setInterval(() => {
          if (this.isPlaying && this.mode === 'file' && this.audioEl) {
            this.elapsed = this.audioEl.currentTime || 0;
            if (isFinite(this.audioEl.duration) && this.audioEl.duration > 0) {
              this.duration = this.audioEl.duration;
            }
          }
        }, 250);
      }

      getFrequencyBars(count = 16) {
        if (!this.isPlaying) {
          return new Array(count).fill(0.08);
        }
        if (this.mode === 'file' || !this.analyser || !this.dataArray) {
          const t = performance.now() / 180;
          const bars = [];
          for (let i = 0; i < count; i++) {
            const wave = 0.25 + 0.55 * Math.abs(Math.sin(t + i * 0.55) * Math.cos(t * 0.7 - i * 0.3));
            bars.push(wave);
          }
          return bars;
        }
        this.analyser.getByteFrequencyData(this.dataArray);
        const bars = [];
        for (let i = 0; i < count; i++) {
          const idx = Math.floor((i / count) * (this.dataArray.length * 0.75));
          const val = (this.dataArray[idx] || 0) / 255;
          bars.push(Math.max(0.1, val));
        }
        return bars;
      }
    }

    // ============================================================================
    // 2. THREE.JS PROCEDURAL 3D SCENE & SCULPTURE ENGINE
    // ============================================================================
    function ThreeExperienceCanvas({
      sceneIndex,
      envelopeOpening,
      heartPulseTrigger,
      onEnvelopeOpened,
      onTriggerOpenEnvelope
    }) {
      const mountRef = useRef(null);
      const stateRef = useRef({
        sceneIndex,
        envelopeOpening,
        openProgress: 0,
        hasTriggeredCallback: false,
        heartPulseTime: -10,
        lastPulseId: 0,
        mouseX: 0,
        mouseY: 0,
        targetMouseX: 0,
        targetMouseY: 0
      });

      useEffect(() => {
        stateRef.current.sceneIndex = sceneIndex;
        if (sceneIndex === 0 && !envelopeOpening) {
          stateRef.current.openProgress = 0;
          stateRef.current.hasTriggeredCallback = false;
        }
      }, [sceneIndex, envelopeOpening]);

      useEffect(() => {
        stateRef.current.envelopeOpening = envelopeOpening;
      }, [envelopeOpening]);

      useEffect(() => {
        if (heartPulseTrigger > 0 && heartPulseTrigger !== stateRef.current.lastPulseId) {
          stateRef.current.lastPulseId = heartPulseTrigger;
          stateRef.current.heartPulseTime = performance.now() / 1000;
        }
      }, [heartPulseTrigger]);

      useEffect(() => {
        const container = mountRef.current;
        if (!container || !window.THREE) return;
        const THREE = window.THREE;

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x14040a, 0.028);

        const camera = new THREE.PerspectiveCamera(
          45,
          container.clientWidth / container.clientHeight,
          0.1,
          120
        );
        camera.position.set(0, 0.4, 9.5);

        const renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true,
          powerPreference: 'high-performance'
        });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.25;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffe6eb, 0.65);
        scene.add(ambientLight);

        const keyLight = new THREE.PointLight(0xffd78a, 2.2, 35);
        keyLight.position.set(4.5, 5.5, 6.5);
        scene.add(keyLight);

        const rimLight = new THREE.PointLight(0xff6b9d, 1.8, 30);
        rimLight.position.set(-5.5, 3.0, -4.0);
        scene.add(rimLight);

        const lavenderFill = new THREE.PointLight(0xc3b1e1, 1.3, 30);
        lavenderFill.position.set(0, -4.5, 5.0);
        scene.add(lavenderFill);

        function createHeartGeometry(scale = 1, depth = 0.35) {
          const shape = new THREE.Shape();
          const x = 0, y = 0;
          shape.moveTo(x, y + 0.35 * scale);
          shape.bezierCurveTo(x, y + 0.35 * scale, x - 0.05 * scale, y, x - 0.35 * scale, y);
          shape.bezierCurveTo(x - 0.85 * scale, y, x - 0.85 * scale, y + 0.62 * scale, x - 0.85 * scale, y + 0.62 * scale);
          shape.bezierCurveTo(x - 0.85 * scale, y + 0.95 * scale, x - 0.52 * scale, y + 1.32 * scale, x, y + 1.65 * scale);
          shape.bezierCurveTo(x + 0.52 * scale, y + 1.32 * scale, x + 0.85 * scale, y + 0.95 * scale, x + 0.85 * scale, y + 0.62 * scale);
          shape.bezierCurveTo(x + 0.85 * scale, y + 0.62 * scale, x + 0.85 * scale, y, x + 0.35 * scale, y);
          shape.bezierCurveTo(x + 0.12 * scale, y, x, y + 0.35 * scale, x, y + 0.35 * scale);

          const geom = new THREE.ExtrudeGeometry(shape, {
            depth: depth * scale,
            bevelEnabled: true,
            bevelSegments: 8,
            steps: 2,
            bevelSize: 0.12 * scale,
            bevelThickness: 0.12 * scale
          });
          geom.center();
          geom.rotateZ(Math.PI);
          return geom;
        }

        function createWaxSealTexture() {
          const canvas = document.createElement('canvas');
          canvas.width = 512;
          canvas.height = 512;
          const ctx = canvas.getContext('2d');

          const grad = ctx.createRadialGradient(256, 256, 20, 256, 256, 250);
          grad.addColorStop(0, '#fff2c6');
          grad.addColorStop(0.55, '#d4af37');
          grad.addColorStop(0.88, '#9e781c');
          grad.addColorStop(1, '#6e4f0c');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, 512, 512);

          ctx.strokeStyle = '#fff5d6';
          ctx.lineWidth = 10;
          ctx.beginPath();
          ctx.arc(256, 256, 205, 0, Math.PI * 2);
          ctx.stroke();

          ctx.strokeStyle = '#7c5910';
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.arc(256, 256, 192, 0, Math.PI * 2);
          ctx.stroke();

          for (let i = 0; i < 24; i++) {
            const angle = (i / 24) * Math.PI * 2;
            const rx = 256 + Math.cos(angle) * 172;
            const ry = 256 + Math.sin(angle) * 172;
            ctx.fillStyle = '#fff3cc';
            ctx.beginPath();
            ctx.arc(rx, ry, 4.5, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.font = 'bold 215px Georgia, serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.fillStyle = '#5e4107';
          ctx.fillText('V', 260, 272);

          ctx.fillStyle = '#fff6d6';
          ctx.fillText('V', 254, 266);

          return new THREE.CanvasTexture(canvas);
        }

        const ambientGroup = new THREE.Group();
        scene.add(ambientGroup);

        const dustCount = 420;
        const dustGeom = new THREE.BufferGeometry();
        const dustPos = new Float32Array(dustCount * 3);
        const dustSpeeds = [];
        for (let i = 0; i < dustCount; i++) {
          dustPos[i * 3] = (Math.random() - 0.5) * 24;
          dustPos[i * 3 + 1] = (Math.random() - 0.5) * 16;
          dustPos[i * 3 + 2] = (Math.random() - 0.5) * 16 - 2;
          dustSpeeds.push(0.003 + Math.random() * 0.007);
        }
        dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
        const dustMat = new THREE.PointsMaterial({
          color: 0xf7e7ce,
          size: 0.08,
          transparent: true,
          opacity: 0.78,
          blending: THREE.AdditiveBlending
        });
        const dustPoints = new THREE.Points(dustGeom, dustMat);
        ambientGroup.add(dustPoints);

        const petalShape = new THREE.Shape();
        petalShape.moveTo(0, 0);
        petalShape.bezierCurveTo(0.14, 0.14, 0.18, 0.34, 0, 0.44);
        petalShape.bezierCurveTo(-0.18, 0.34, -0.14, 0.14, 0, 0);
        const petalGeom = new THREE.ShapeGeometry(petalShape);
        const miniHeartGeom = createHeartGeometry(0.14, 0.05);

        const floaters = [];
        const petalColors = [0x8b1538, 0xc92a55, 0xf4c2c2, 0xff8da1, 0xd4af37];
        for (let i = 0; i < 48; i++) {
          const isHeart = i % 4 === 0;
          const mat = new THREE.MeshStandardMaterial({
            color: petalColors[i % petalColors.length],
            emissive: isHeart ? 0x5c1028 : 0x22040c,
            emissiveIntensity: 0.45,
            roughness: 0.35,
            metalness: 0.25,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.85
          });
          const mesh = new THREE.Mesh(isHeart ? miniHeartGeom : petalGeom, mat);
          mesh.position.set(
            (Math.random() - 0.5) * 18,
            (Math.random() - 0.5) * 14,
            (Math.random() - 0.5) * 10 - 2
          );
          mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
          const scale = 0.65 + Math.random() * 0.75;
          mesh.scale.setScalar(scale);
          ambientGroup.add(mesh);
          floaters.push({
            mesh,
            vy: 0.006 + Math.random() * 0.01,
            vx: (Math.random() - 0.5) * 0.008,
            rotSpeed: (Math.random() - 0.5) * 0.025,
            phase: Math.random() * Math.PI * 2
          });
        }

        // SCENE 0: ENVELOPE
        const envelopeGroup = new THREE.Group();
        envelopeGroup.position.set(0, 0.45, 0);
        scene.add(envelopeGroup);

        const burgundyVelvetMat = new THREE.MeshStandardMaterial({
          color: 0x4a0e1e,
          roughness: 0.48,
          metalness: 0.18
        });
        const innerBurgundyMat = new THREE.MeshStandardMaterial({
          color: 0x2b0510,
          roughness: 0.6,
          metalness: 0.1
        });
        const goldTrimMat = new THREE.MeshStandardMaterial({

          const rect = container.getBoundingClientRect();

          if (stateRef.current.sceneIndex !== 0 || stateRef.current.envelopeOpening) return;
          const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
          const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
          const rect = container.getBoundingClientRect();
          pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
          pointer.y = -(((clientY - rect.top) / rect.height) * 2 - 1);
          raycaster.setFromCamera(pointer, camera);

              waxSealGroup.position.z = 0.08;
              waxSealGroup.scale.setScalar(1 + Math.sin(t * 3) * 0.03);
              topFlapPivot.rotation.x = 0;
              letterCard.position.set(0, 0, 0.04);

          if (idx === 2) {

            teddyGroup.rotation.y = st.mouseX * 0.4 + Math.sin(t * 1.2) * 0.18;
            teddyGroup.rotation.z = Math.sin(t * 1.5) * 0.05;
            const pulse = 1 + Math.sin(t * 4.2) * 0.09;
            teddyHeart.scale.setScalar(pulse);

          if (idx === 3) {

            let clickBoost = 0;

            if (dt >= 0 && dt < 1.35) {
              const beat1 = Math.exp(-Math.pow((dt - 0.1) / 0.08, 2)) * 0.42;
              const beat2 = Math.exp(-Math.pow((dt - 0.28) / 0.09, 2)) * 0.32;
              clickBoost = beat1 + beat2;

              pumpingHeartMat.emissiveIntensity = 0.55 + clickBoost * 1.8;

              shockwaveRings.forEach((ring, rIdx) => {

                  0.68 + bh.vy * dt - 1.4 * dt * dt,
                  0.25 + bh.vz * dt
                );
                bh.mesh.rotation.y += 0.08;
                bh.mesh.scale.setScalar(Math.max(0.01, 1 - dt * 0.72));
              });
            } else {
              pumpingHeartMat.emissiveIntensity = 0.55 + idleBeat * 1.2;

                ring.material.opacity = 0;
              });
              burstHearts.forEach((bh) => {
                bh.mesh.visible = false;
              });
            }

            const totalScale = 1 + idleBeat + clickBoost;

            pumpingMainHeart.rotation.y = Math.sin(t * 0.9) * 0.25 + st.mouseX * 0.35;

              const a = oh.angle + t * 0.65;
              oh.mesh.position.set(
                Math.cos(a) * 2.55,
                0.95 + Math.sin(a * 2 + i) * 0.45,
                Math.sin(a) * 1.65
              );
              oh.mesh.rotation.y = -a;
            });
          }

          if (idx === 13) {
            cosmicRing.rotation.z += 0.008;
            universeOrbitStars.forEach((us) => {
              us.mesh.scale.setScalar(0.75 + Math.sin(t * 4 + us.phase) * 0.35);
            });
          }

          if (idx === 14) {
            leftMiniTeddy.position.y = -0.2 + Math.sin(t * 2.0) * 0.12;
            rightMiniTeddy.position.y = -0.2 + Math.cos(t * 2.0) * 0.12;
            butterflies.forEach((b) => {
              const flap = Math.sin(t * 14 + b.phase) * 0.68;
              b.leftWing.rotation.y = flap;
              b.rightWing.rotation.y = -flap;
              const a = b.angle + t * b.speed;
              b.group.position.x = Math.cos(a) * 2.45;
              b.group.position.y = 0.65 + Math.sin(a * 2) * 0.65;
              b.group.rotation.y = -a;
            });
          }

          if (idx === 15) {
            promiseJarGroup.position.y = 0.45 + Math.sin(t * 1.3) * 0.08;
            promiseJarGroup.rotation.y = st.mouseX * 0.35 + Math.sin(t * 0.6) * 0.15;
            jarInsideStars.forEach((js) => {
              js.mesh.position.y = js.baseY + Math.sin(t * 2.4 + js.phase) * 0.08;
              js.mesh.rotation.y += 0.03;
            });
          }

          if (idx === 16) {
            const beat = 1 + Math.sin(t * 3.6) * 0.1;
            finalCenterHeart.scale.setScalar(beat);
            finalCenterHeart.rotation.y = Math.sin(t * 0.8) * 0.3 + st.mouseX * 0.25;
            finalHaloRing.rotation.z += 0.01;
          }

          renderer.render(scene, camera);
        };

        animate();

        return () => {
          cancelAnimationFrame(animFrameId);
          window.removeEventListener('mousemove', handlePointerMove);
          window.removeEventListener('touchmove', handlePointerMove);
          window.removeEventListener('resize', handleResize);
          container.removeEventListener('click', handleCanvasClick);
          if (renderer.domElement && container.contains(renderer.domElement)) {
            container.removeChild(renderer.domElement);
          }
          renderer.dispose();
        };
      }, [onEnvelopeOpened, onTriggerOpenEnvelope]);

      return (
        <div
          ref={mountRef}
          className="fixed inset-0 w-full h-full z-0 cursor-pointer"
          aria-label="Interactive 3D Romantic Canvas"
        />
      );
    }

    // ============================================================================
    // 3B. CINEMATIC 10-SECOND LOOPING COSMIC COUPLE ANIMATION
    // ============================================================================
    function OurUniverseAnimatedScene({ isInfinity }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;

        const resize = () => {
          const parent = canvas.parentElement;
          if (!parent) return;
          canvas.width = parent.clientWidth;
          canvas.height = parent.clientHeight;
        };
        resize();
        window.addEventListener('resize', resize);

        const pathStars = Array.from({ length: 180 }, (_, i) => ({
          u: Math.random(),
          spread: (Math.random() - 0.5) * 2,
          size: 1.2 + Math.random() * 2.4,
          twinkle: Math.random() * Math.PI * 2,
          speed: 0.14 + (i % 5) * 0.03
        }));

        const bgStars = Array.from({ length: 160 }, () => ({
          x: Math.random(),
          y: Math.random() * 0.72,
          r: 0.6 + Math.random() * 1.6,
          phase: Math.random() * Math.PI * 2
        }));

        const floatingHearts = Array.from({ length: 18 }, (_, i) => ({
          x: 0.1 + (i / 18) * 0.8,
          y: 0.2 + Math.random() * 0.6,
          size: 5 + (i % 4) * 2.5,
          phase: i * 0.7
        }));

        const startTime = performance.now();

        const drawHeart = (cx, cy, size, alpha) => {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.scale(size / 16, size / 16);
          ctx.beginPath();
          ctx.moveTo(0, 4);
          ctx.bezierCurveTo(0, -2, -10, -2, -10, 4);
          ctx.bezierCurveTo(-10, 10, 0, 14, 0, 18);
          ctx.bezierCurveTo(0, 14, 10, 10, 10, 4);
          ctx.bezierCurveTo(10, -2, 0, -2, 0, 4);
          ctx.fillStyle = `rgba(255, 196, 176, ${alpha})`;
          ctx.shadowColor = '#ffd78a';
          ctx.shadowBlur = 10;
          ctx.fill();
          ctx.restore();
        };

        const render = (now) => {
          animId = requestAnimationFrame(render);
          const w = canvas.width;
          const h = canvas.height;
          const elapsed = ((now - startTime) / 1000) % 10;
          const t = (now - startTime) / 1000;

          const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
          skyGrad.addColorStop(0, '#0d061a');
          skyGrad.addColorStop(0.45, '#2b1038');
          skyGrad.addColorStop(0.72, '#5c2648');
          skyGrad.addColorStop(1, '#1a0814');
          ctx.fillStyle = skyGrad;
          ctx.fillRect(0, 0, w, h);

          const horizonY = h * 0.66;
          const horGlow = ctx.createRadialGradient(w * 0.5, horizonY, 10, w * 0.5, horizonY, w * 0.55);
          horGlow.addColorStop(0, 'rgba(255, 224, 150, 0.55)');
          horGlow.addColorStop(0.45, 'rgba(212, 138, 120, 0.22)');
          horGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.fillStyle = horGlow;
          ctx.fillRect(0, 0, w, h);

          bgStars.forEach((s) => {
            const a = 0.35 + Math.sin(t * 2.5 + s.phase) * 0.35;
            ctx.fillStyle = `rgba(255, 243, 214, ${a})`;
            ctx.beginPath();
            ctx.arc(s.x * w, s.y * h, s.r, 0, Math.PI * 2);
            ctx.fill();
          });

          const satX = w * 0.76;
          const satY = h * 0.27;
          const satR = Math.min(w, h) * 0.085;
          ctx.save();
          ctx.translate(satX, satY);
          ctx.rotate(-0.28);
          const planetGrad = ctx.createLinearGradient(-satR, -satR, satR, satR);
          planetGrad.addColorStop(0, '#d8b49c');
          planetGrad.addColorStop(1, '#52344d');
          ctx.fillStyle = planetGrad;
          ctx.beginPath();
          ctx.arc(0, 0, satR, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = 'rgba(247, 231, 206, 0.48)';
          ctx.lineWidth = satR * 0.16;
          ctx.beginPath();
          ctx.ellipse(0, 0, satR * 2.15, satR * 0.45, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();

          pathStars.forEach((ps) => {
            const prog = (ps.u + t * ps.speed) % 1;
            const py = horizonY + Math.pow(prog, 1.45) * (h - horizonY);
            const halfWidth = (0.04 + Math.pow(prog, 1.35) * 0.48) * w;
            const px = w * 0.5 + ps.spread * halfWidth;
            const alpha = Math.min(1, prog * 1.8) * (0.65 + Math.sin(t * 5 + ps.twinkle) * 0.35);

            ctx.fillStyle = `rgba(255, 232, 163, ${alpha})`;
            ctx.beginPath();
            ctx.arc(px, py, ps.size * (0.5 + prog * 1.1), 0, Math.PI * 2);
            ctx.fill();
          });

          const heartReveal = Math.min(1, Math.max(0, (elapsed - 1.2) / 3.5));
          if (heartReveal > 0) {
            const hcX = w * 0.5;
            const hcY = h * 0.31;
            const hScale = Math.min(w, h) * (isInfinity ? 0.0135 : 0.0115);
            const totalPts = Math.floor(56 * heartReveal);

            for (let i = 0; i < totalPts; i++) {
              const a = (i / 56) * Math.PI * 2;
              const hx = 16 * Math.pow(Math.sin(a), 3);
              const hy = -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a));
              const sx = hcX + hx * hScale;
              const sy = hcY + hy * hScale;

              ctx.fillStyle = 'rgba(255, 240, 185, 0.92)';
              ctx.shadowColor = '#ffd78a';
              ctx.shadowBlur = 12;
              ctx.beginPath();
              ctx.arc(sx, sy, 2.2 + Math.sin(t * 6 + i) * 0.8, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.shadowBlur = 0;

            if (elapsed > 6.2) {
              const ribProg = Math.min(1, (elapsed - 6.2) / 2.2);
              ctx.strokeStyle = `rgba(255, 232, 165, ${0.65 * ribProg})`;
              ctx.lineWidth = 2.5;
              ctx.beginPath();
              ctx.moveTo(hcX, hcY + hScale * 14);
              ctx.quadraticCurveTo(w * 0.25, h * 0.48, w * (0.5 - 0.5 * ribProg), h * 0.56);
              ctx.stroke();

              ctx.beginPath();
              ctx.moveTo(hcX, hcY + hScale * 14);
              ctx.quadraticCurveTo(w * 0.75, h * 0.48, w * (0.5 + 0.5 * ribProg), h * 0.56);
              ctx.stroke();
            }
          }

          floatingHearts.forEach((fh) => {
            const fy = ((fh.y - t * 0.04) % 0.75 + 0.75) % 0.75 + 0.1;
            const fx = fh.x + Math.sin(t * 1.4 + fh.phase) * 0.02;
            drawHeart(fx * w, fy * h, fh.size, 0.65);
          });

          const runCycle = Math.sin(t * 7.5);
          const bobY = Math.abs(runCycle) * 4.5;
          const baseY = h * 0.79 - bobY;
          const sc = Math.min(w, h) / 420;

          const manX = w * 0.445;
          ctx.save();
          ctx.translate(manX, baseY);
          ctx.scale(sc, sc);
          ctx.strokeStyle = '#181424';
          ctx.lineWidth = 8;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(-5, 10);
          ctx.lineTo(-9, 44 + runCycle * 8);
          ctx.moveTo(6, 10);
          ctx.lineTo(10, 44 - runCycle * 8);
          ctx.stroke();
          ctx.fillStyle = '#f5efe6';
          ctx.beginPath();
          ctx.roundRect(-14, -28, 28, 40, 8);
          ctx.fill();
          ctx.fillStyle = '#24141d';
          ctx.beginPath();
          ctx.arc(0, -40, 10.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          const womanX = w * 0.555;
          ctx.save();
          ctx.translate(womanX, baseY + 3);
          ctx.scale(sc, sc);
          const dressGrad = ctx.createLinearGradient(0, -25, 18, 48);
          dressGrad.addColorStop(0, '#6e122b');
          dressGrad.addColorStop(1, '#3b0716');
          ctx.fillStyle = dressGrad;
          ctx.beginPath();
          ctx.moveTo(-10, -24);
          ctx.lineTo(10, -24);
          ctx.lineTo(24 + Math.sin(t * 6) * 4, 46);
          ctx.lineTo(-16, 46);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#24141d';
          ctx.beginPath();
          ctx.arc(0, -37, 9.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(4, -22, 10, 17, 0.25 + Math.sin(t * 5) * 0.08, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          const handX = w * 0.5;
          const handY = baseY - 2 * sc;
          ctx.strokeStyle = '#f5efe6';
          ctx.lineWidth = 4.5 * sc;
          ctx.beginPath();
          ctx.moveTo(manX + 12 * sc, baseY - 18 * sc);
          ctx.lineTo(handX, handY);
          ctx.lineTo(womanX - 10 * sc, baseY - 15 * sc);
          ctx.stroke();

          const handGlow = ctx.createRadialGradient(handX, handY, 1, handX, handY, 18 * sc);
          handGlow.addColorStop(0, 'rgba(255, 245, 190, 0.95)');
          handGlow.addColorStop(1, 'rgba(255, 200, 120, 0)');
          ctx.fillStyle = handGlow;
          ctx.beginPath();
          ctx.arc(handX, handY, 18 * sc, 0, Math.PI * 2);
          ctx.fill();
        };

        animId = requestAnimationFrame(render);
        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('resize', resize);
        };
      }, [isInfinity]);

      return <canvas ref={canvasRef} className="w-full h-full block" />;
    }

              setSceneIdx((prev) => prev + 1);

              </div>
            )}

            {sceneIdx === 16 && (
              <div className="w-full flex-1 flex flex-col items-center justify-end pb-2 sm:pb-4 animate-scene-enter">
                <div className="glass-luxury pointer-events-auto max-w-3xl w-full rounded-3xl px-6 py-6 sm:px-10 sm:py-8 text-center border-[#d4af37]/55 max-h-[74vh] overflow-y-auto">
                  <div className="space-y-2 mb-5">
                    {ONE_LAST_THING_LINES.map((line, idx) => (
                      <p
                        key={idx}
                        className={`font-editorial italic text-lg sm:text-xl md:text-2xl text-[#f7e7ce]/95 transition-all duration-700 ${
                          idx < visibleLastLines ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-2'
                        }`}
                      >
                        {line}
                      </p>
                    ))}
                  </div>

                  <div
                    className={`pt-4 border-t border-[#d4af37]/30 transition-all duration-1000 ${
                      visibleLastLines >= 5 ? 'opacity-100 scale-100' : 'opacity-0 scale-95'
                    }`}
                  >
                    <h2 className="font-editorial text-3xl sm:text-5xl font-bold text-[#ffd78a] drop-shadow-[0_0_24px_rgba(212,175,55,0.55)] mb-3">
                      Happy Men's Day, Vivek ❤️
                    </h2>
                    <p className="font-editorial text-lg sm:text-xl text-[#f4c2c2] leading-relaxed mb-5">
                      I'm so glad you exist.
                      <br />
                      I'm so glad our paths crossed.
                      <br />
                      And I'm so glad it's you.
                    </p>
                  </div>

                  <div
                    className={`bg-[#2b0510]/65 border border-[#d4af37]/35 rounded-2xl px-5 py-4 mb-6 transition-all duration-1000 ${
                      visibleLastLines >= 6 ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-3'
                    }`}
                  >
                    <p className="font-handwritten text-3xl sm:text-4xl text-[#ff9ec2] leading-snug">
                      For you, Vivek...
                      <br />
                      You are not just someone I love.
                      <br />
                      You're someone I want to grow with, dream with, and make a thousand beautiful memories with.
                      <br />
                      <span className="text-[#ffd78a]">Forever yours. ❤️</span>
                    </p>
                  </div>

                  <button
                    onClick={handleReplay}
                    className="gold-cta-btn px-8 py-3.5 rounded-full font-ui text-sm sm:text-base font-bold text-[#1a050b] hover:scale-105 active:scale-95 transition cursor-pointer inline-flex items-center gap-2 shadow-lg"
                  >
                    <span>Replay My Little Surprise ❤️</span>
                  </button>
                </div>
              </div>
            )}
          </main>

          <footer className="relative z-20 w-full px-4 pb-4 sm:pb-6 flex justify-center pointer-events-none">
            <nav
              aria-label="Storybook Navigation"
              className="glass-luxury pointer-events-auto px-3 sm:px-5 py-2.5 rounded-full flex items-center gap-2 sm:gap-4"
            >
              <button
                onClick={handlePrev}
                disabled={sceneIdx === 0}
                className="px-3.5 py-2 rounded-full font-ui text-xs sm:text-sm font-medium text-[#f7e7ce] hover:bg-[#d4af37]/20 disabled:opacity-30 disabled:pointer-events-none transition flex items-center gap-1.5 cursor-pointer"
                aria-label="Previous Scene"
              >
                <span>←</span>
                <span className="hidden sm:inline">Previous</span>
              </button>

              <div className="flex items-center gap-1.5 sm:gap-2 px-1">
                {STORY_SCENES.map((s, idx) => {
                  const active = idx === sceneIdx;
                  return (
                    <button
                      key={s.id}
                      onClick={() => {
                        if (idx > 0) setEnvelopeOpening(true);
                        else setEnvelopeOpening(false);
                        setSceneIdx(idx);
                      }}
                      title={s.label}
                      aria-label={`Go to ${s.label}`}
                      className={`transition-all duration-300 rounded-full cursor-pointer ${
                        active
                          ? 'w-7 h-2.5 bg-gradient-to-r from-[#d4af37] to-[#ff8da1] shadow-[0_0_10px_#d4af37]'
                          : 'w-2.5 h-2.5 bg-[#f7e7ce]/30 hover:bg-[#f7e7ce]/65'
                      }`}
                    />
                  );
                })}
              </div>

              <button
                onClick={handleNext}
                disabled={sceneIdx === STORY_SCENES.length - 1}
                className="px-3.5 py-2 rounded-full font-ui text-xs sm:text-sm font-medium text-[#f7e7ce] hover:bg-[#d4af37]/20 disabled:opacity-30 disabled:pointer-events-none transition flex items-center gap-1.5 cursor-pointer"
                aria-label="Next Scene"
              >
                <span className="hidden sm:inline">{sceneIdx === 0 ? 'Open' : 'Next'}</span>
                <span>→</span>
              </button>

              {sceneIdx > 0 && (
                <button
                  onClick={handleReplay}
                  title="Replay from Envelope"
                  aria-label="Replay from Envelope"
                  className="ml-1 w-8 h-8 rounded-full border border-[#d4af37]/35 flex items-center justify-center text-xs text-[#f7e7ce]/85 hover:text-[#d4af37] hover:border-[#d4af37] transition cursor-pointer"
                >
                  ↻
                </button>
              )}
            </nav>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
